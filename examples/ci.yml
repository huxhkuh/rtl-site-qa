# Place under .github/workflows/ and adapt working-directory and start-server step.
name: RTL site QA
on: [pull_request, workflow_dispatch]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: tools/rtl-qa
      - run: npx playwright install --with-deps chromium
        working-directory: tools/rtl-qa
      # Replace this with the project's existing server/build/test setup.
      - name: Start read-only static preview
        run: node tools/rtl-qa/src/serve.mjs ./dist 4174 &
      - name: Wait for preview
        run: node tools/rtl-qa/examples/wait-for-server.mjs http://127.0.0.1:4174
      - run: npm run qa -- --config ../../qa.config.json --out runs/ci
        working-directory: tools/rtl-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl-qa-report
          path: tools/rtl-qa/runs/ci
